[project]
name = "jobpulse"
version = "0.1.0"
description = "A daily, serverless career-agent loop: ingest internship postings, extract requirements with an LLM, track skill demand and trends, tailor a truthful resume, propose portfolio projects, publish a dashboard."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "reportlab>=4.2",
]

[project.scripts]
jobpulse = "jobpulse.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "moto[dynamodb,s3,ssm]>=5.0",
    "boto3>=1.35",
    "mypy>=1.13",
    "ruff>=0.7",
]
infra = [
    "aws-cdk-lib>=2.170",
    "constructs>=10.3",
    "cdk-nag>=2.29,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpulse"]

[tool.ruff]
line-length = 110
extend-exclude = ["infra/cdk.out", "build", "dashboard/node_modules"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "infra", "scripts"]
exclude = ["infra/cdk\\.out/", "build/"]
explicit_package_bases = true
mypy_path = ["src", "infra", "."]

[[tool.mypy.overrides]]
module = ["reportlab.*", "boto3.*", "botocore.*", "moto.*", "aws_cdk.*", "cdk_nag.*", "constructs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

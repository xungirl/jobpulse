<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <linearGradient id="grad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#6366f1"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <style>
      .t { font-size: 13px; fill: #0f172a; font-weight: 600; }
      .s { font-size: 11px; fill: #475569; }
      .h { font-size: 12px; fill: #64748b; font-weight: 700; letter-spacing: 0.08em; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .aws { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.2; }
      .ext { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.2; }
      .core { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 1.4; }
      .step { fill: #ffffff; stroke: #a78bfa; stroke-width: 1.2; }
      .ln { stroke: #64748b; stroke-width: 1.4; fill: none; }
      .lv { stroke: #7c3aed; stroke-width: 1.6; fill: none; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="1240" height="760" fill="#ffffff"/>
  <text x="32" y="44" font-size="24" font-weight="800" fill="#0f172a">jobpulse</text>
  <text x="140" y="44" font-size="14" fill="#475569">daily serverless career-agent loop · AWS us-east-2 · same core runs locally</text>
  <rect x="32" y="56" width="88" height="4" rx="2" fill="url(#grad)"/>

  <!-- ===================== AWS account region ===================== -->
  <rect x="24" y="84" width="890" height="500" rx="16" fill="#fffdf9" stroke="#fed7aa" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="44" y="110" class="h">AWS ACCOUNT · us-east-2 · NO VPC / NAT · NOTHING ALWAYS-ON</text>

  <!-- scheduler -->
  <rect x="44" y="132" width="170" height="64" rx="10" class="aws"/>
  <text x="58" y="158" class="t">EventBridge Scheduler</text>
  <text x="58" y="177" class="s">cron(0 14 * * ? *) UTC</text>
  <path d="M214 164 L262 164" class="ln" marker-end="url(#arr)"/>

  <!-- step functions container -->
  <rect x="266" y="124" width="630" height="226" rx="12" class="aws"/>
  <text x="282" y="148" class="t">Step Functions (Standard) — one execution per day</text>
  <text x="282" y="166" class="s">each step: retry on Lambda errors · catch → record error → continue ("degrade, don't die") · Fail state if degraded</text>

  <!-- six steps -->
  <g>
    <rect x="282" y="184" width="92" height="56" rx="9" class="step"/><text x="296" y="208" class="t">ingest</text><text x="296" y="226" class="s">postings+JD</text>
    <rect x="384" y="184" width="92" height="56" rx="9" class="step"/><text x="398" y="208" class="t">extract</text><text x="398" y="226" class="s">LLM → JSON</text>
    <rect x="486" y="184" width="92" height="56" rx="9" class="step"/><text x="500" y="208" class="t">trends</text><text x="500" y="226" class="s">demand Δ</text>
    <rect x="588" y="184" width="92" height="56" rx="9" class="step"/><text x="602" y="208" class="t">tailor</text><text x="602" y="226" class="s">PDF resumes</text>
    <rect x="690" y="184" width="92" height="56" rx="9" class="step"/><text x="704" y="208" class="t">gaps</text><text x="704" y="226" class="s">3 ideas/day</text>
    <rect x="792" y="184" width="92" height="56" rx="9" class="step"/><text x="806" y="208" class="t">publish</text><text x="806" y="226" class="s">dashboard</text>
    <path d="M374 212 L382 212" class="lv" marker-end="url(#arrv)"/>
    <path d="M476 212 L484 212" class="lv" marker-end="url(#arrv)"/>
    <path d="M578 212 L586 212" class="lv" marker-end="url(#arrv)"/>
    <path d="M680 212 L688 212" class="lv" marker-end="url(#arrv)"/>
    <path d="M782 212 L790 212" class="lv" marker-end="url(#arrv)"/>
  </g>
  <rect x="282" y="256" width="602" height="80" rx="10" class="core"/>
  <text x="298" y="280" class="t">6 Lambda functions · Python 3.12 · arm64 · 256–512 MB · reserved concurrency 1 · timeouts</text>
  <text x="298" y="300" class="s">thin handlers → the SAME jobpulse core the CLI runs: run_step(ctx, step, date)</text>
  <text x="298" y="318" class="s">ports: DocStore · BlobStore · LLMProvider · HttpClient   |   adapters: DynamoDB · S3 · Qwen · urllib (robots.txt)</text>

  <!-- data stores -->
  <rect x="44" y="384" width="230" height="78" rx="10" class="aws"/>
  <text x="58" y="410" class="t">DynamoDB (on-demand)</text>
  <text x="58" y="428" class="s">one table, pk/sk single-table design</text>
  <text x="58" y="446" class="s">postings · LLM cache · demand · runs</text>

  <rect x="300" y="384" width="230" height="78" rx="10" class="aws"/>
  <text x="314" y="410" class="t">S3 (private, SSE-S3)</text>
  <text x="314" y="428" class="s">site · data JSON · resume PDFs</text>
  <text x="314" y="446" class="s">lifecycle: PDFs 30 d · history 90 d</text>

  <rect x="556" y="384" width="160" height="78" rx="10" class="aws"/>
  <text x="570" y="410" class="t">CloudFront</text>
  <text x="570" y="428" class="s">Origin Access Control</text>
  <text x="570" y="446" class="s">HTTPS · PriceClass_100</text>

  <rect x="742" y="384" width="154" height="78" rx="10" class="aws"/>
  <text x="756" y="410" class="t">SSM Parameter</text>
  <text x="756" y="428" class="s">SecureString</text>
  <text x="756" y="446" class="s">DashScope API key</text>

  <path d="M330 336 L190 382" class="ln" marker-end="url(#arr)"/>
  <path d="M520 336 L430 382" class="ln" marker-end="url(#arr)"/>
  <path d="M530 423 L554 423" class="ln" marker-end="url(#arr)"/>
  <path d="M820 336 L820 382" class="ln dash" marker-end="url(#arr)"/>

  <!-- ops -->
  <rect x="44" y="490" width="852" height="76" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="58" y="514" class="t">Observability &amp; cost guardrails</text>
  <text x="58" y="534" class="s">CloudWatch Logs: structured JSON, 14-day retention · EMF: 8 run-health metrics (LLM calls, cache hit rate, failures…) · X-Ray on the state machine</text>
  <text x="58" y="552" class="s">AWS Budgets alerts at $1 and $5 (actual + forecast) · alarm on failed/degraded executions → SNS email · idempotent runs keyed by date / content hash</text>

  <!-- ===================== external ===================== -->
  <text x="942" y="110" class="h">PUBLIC SOURCES · robots.txt-aware</text>
  <rect x="942" y="124" width="274" height="56" rx="10" class="ext"/>
  <text x="956" y="148" class="t">SimplifyJobs listings.json</text><text x="956" y="166" class="s">Summer 2027 internships (GitHub raw)</text>
  <rect x="942" y="190" width="274" height="56" rx="10" class="ext"/>
  <text x="956" y="214" class="t">ATS public JSON APIs</text><text x="956" y="232" class="s">Greenhouse · Lever · Ashby · Workday · Oracle</text>
  <rect x="942" y="256" width="274" height="56" rx="10" class="ext"/>
  <text x="956" y="280" class="t">GitHub Search · HN Algolia</text><text x="956" y="298" class="s">7-day developer-attention signals</text>
  <rect x="942" y="322" width="274" height="56" rx="10" class="ext"/>
  <text x="956" y="346" class="t">Qwen via DashScope</text><text x="956" y="364" class="s">qwen3.8-flash · OpenAI-compatible API</text>
  <path d="M940 152 L896 196" class="ln dash" marker-end="url(#arr)"/>
  <path d="M940 218 L896 214" class="ln dash" marker-end="url(#arr)"/>
  <path d="M940 284 L896 232" class="ln dash" marker-end="url(#arr)"/>
  <path d="M940 350 L884 300" class="ln dash" marker-end="url(#arr)"/>

  <rect x="942" y="398" width="274" height="64" rx="10" class="box"/>
  <text x="956" y="424" class="t">Browser · public dashboard</text><text x="956" y="442" class="s">vanilla TS, zero runtime deps</text>
  <path d="M636 462 L636 476 L1079 476 L1079 466" class="ln" marker-end="url(#arr)"/>

  <!-- ===================== local mode ===================== -->
  <rect x="24" y="604" width="1192" height="132" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="44" y="630" class="h">LOCAL MODE · uv run jobpulse run --local --date YYYY-MM-DD</text>
  <rect x="44" y="646" width="200" height="70" rx="10" class="box"/>
  <text x="58" y="672" class="t">CLI (Python loop)</text><text x="58" y="690" class="s">run / backfill / eval / runs</text><text x="58" y="706" class="s">linkedin (draft only)</text>
  <path d="M244 681 L300 681" class="ln" marker-end="url(#arr)"/>
  <rect x="304" y="646" width="380" height="70" rx="10" class="core"/>
  <text x="320" y="672" class="t">same jobpulse core: run_step(ctx, step, date)</text>
  <text x="320" y="692" class="s">identical business logic, metrics, failure policy</text>
  <path d="M684 681 L740 681" class="ln" marker-end="url(#arr)"/>
  <rect x="744" y="646" width="220" height="70" rx="10" class="box"/>
  <text x="758" y="672" class="t">SQLite DocStore</text><text x="758" y="690" class="s">same pk/sk schema</text><text x="758" y="706" class="s">./out/state.sqlite</text>
  <rect x="984" y="646" width="212" height="70" rx="10" class="box"/>
  <text x="998" y="672" class="t">Files + fake LLM</text><text x="998" y="690" class="s">./out/site · tests/CI use</text><text x="998" y="706" class="s">FakeProvider + moto</text>
</svg>
